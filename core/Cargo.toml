[package]
name = "lingoplay-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
uniffi = "=0.31.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
roxmltree = "0.20"
html-escape = "0.2"
unicode-normalization = "0.1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
tiny_http = "0.12"
