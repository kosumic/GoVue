plugins {
    id "com.android.application" version "9.2.1"
}

def source = providers.environmentVariable("GOVUE_NSH_ANDROID_JAVA")
        .orElse(providers.environmentVariable("NSH_SOURCE").map { "${it}/crates/nsh-platform-android/java" })
        .orElse(rootProject.layout.projectDirectory.dir("../../../nsh/crates/nsh-platform-android/java").asFile.absolutePath)
def nshJava = file(source.get())
if (!new File(nshJava, "com/longbridge/nsh/NshView.java").isFile()) {
    throw new GradleException("Run native-shell/android/build-release.sh to locate the locked Native Shell Android host.")
}

def govue = rootProject.layout.projectDirectory.dir("../..")
def nativeInputs = layout.buildDirectory.dir("govue").get()
def version = new groovy.json.JsonSlurper().parse(govue.file("package.json").asFile).version
def parts = version.tokenize(".").collect { it.toInteger() }
def preview = providers.environmentVariable("GOVUE_PREVIEW").orNull == "1"
def keyStore = providers.environmentVariable("GOVUE_ANDROID_KEYSTORE").orNull
def credentials = ["GOVUE_ANDROID_STORE_PASSWORD", "GOVUE_ANDROID_KEY_ALIAS", "GOVUE_ANDROID_KEY_PASSWORD"]
        .collectEntries { [it, providers.environmentVariable(it).orNull] }

android {
    namespace "io.github.kaminarios.govue.shell"
    compileSdk 37

    defaultConfig {
        applicationId = preview ? "io.github.kaminarios.govue.nsh" : "io.github.kaminarios.govue"
        minSdk 26
        targetSdk 36
        versionCode parts[0] * 1000000 + parts[1] * 1000 + parts[2]
        versionName version
        ndk { abiFilters "arm64-v8a" }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        lintConfig file("lint.xml")
    }

    sourceSets.main {
        java.srcDir nshJava
        java.srcDir "../../modules/govue-core/android/src/shared/java"
        jniLibs.srcDir nativeInputs.dir("jniLibs").asFile
        res.srcDir nativeInputs.dir("res").asFile
        res.srcDir "../../modules/govue-core/android/src/main/res"
    }
    sourceSets.main.kotlin.srcDir "../../modules/govue-core/android/src/shared/kotlin"

    signingConfigs {
        if (!preview && keyStore) {
            if (credentials.values().any { !it }) {
                throw new GradleException("Provide the GoVue release keystore passwords and key alias.")
            }
            distribution {
                storeFile file(keyStore)
                storePassword credentials.GOVUE_ANDROID_STORE_PASSWORD
                keyAlias credentials.GOVUE_ANDROID_KEY_ALIAS
                keyPassword credentials.GOVUE_ANDROID_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            if (preview) {
                signingConfig signingConfigs.debug
            } else if (keyStore) {
                signingConfig signingConfigs.distribution
            }
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.16.0"
    implementation "androidx.media3:media3-exoplayer:1.9.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.9.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.9.1"
    implementation "com.squareup.okhttp3:okhttp:5.5.1"
    implementation "com.google.mlkit:translate:17.0.3"
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
    implementation "androidx.camera:camera-camera2:1.6.0"
    implementation "androidx.camera:camera-lifecycle:1.6.0"
    implementation "androidx.camera:camera-view:1.6.0"
    constraints {
        implementation("androidx.arch.core:core-runtime:2.2.0") {
            because "Align ML Kit's transitive Lifecycle runtime with AndroidX core-common"
        }
        implementation("androidx.appcompat:appcompat:1.7.1") {
            because "Keep the CameraX preview and AppCompat resources on the same release"
        }
        implementation("androidx.core:core-ktx:1.13.1") {
            because "Keep AndroidX Core and Core KTX at the same patch level"
        }
        implementation("androidx.lifecycle:lifecycle-livedata:2.6.2") {
            because "Align the barcode scanner and camera Lifecycle dependencies"
        }
    }
}
