[package]
name = "govue-native-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

[workspace]

[lib]
name = "nsh"
crate-type = ["cdylib"]

[dependencies]
govue-core = { path = "../../core" }
govue-shell-runtime = { path = "../runtime" }
nsh-base = { version = "=0.6.1", features = ["highlight"] }
nsh-core = "=0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "android")'.dependencies]
nsh-platform-android = { version = "=0.6.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "websocket", "updater", "svg"] }
