[package]
name = "govue-native-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

[workspace]

[lib]
name = "nsh"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "GoVue"
path = "src/ios_main.rs"

[dependencies]
govue-core = { path = "../../core" }
govue-shell-runtime = { path = "../runtime" }
nsh-base = { version = "=0.6.1", features = ["highlight"] }
nsh-core = "=0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "android")'.dependencies]
nsh-platform-android = { version = "=0.6.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "websocket", "updater", "svg"] }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6.2"
nsh-ios-app = { version = "=0.6.1", default-features = false }
nsh-platform-ios = { version = "=0.6.1", default-features = false, features = ["highlight", "svg"] }
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSKeyValueObserving", "NSObject", "NSString", "NSURL", "NSURLRequest"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "UIResponder", "UIView"] }
url = "2"
