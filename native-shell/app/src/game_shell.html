<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src about:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: __GOVUE_BACKGROUND__ }
    iframe { border: 0; width: 100%; height: 100%; display: block }
  </style>
</head>
<body>
<iframe id="surface" title="Interactive learning game" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
<script>
(() => {
  const frame = document.getElementById('surface');
  const session = __GOVUE_SESSION__;
  addEventListener('message', event => {
    if (event.source !== frame.contentWindow || event.origin !== 'null') return;
    const message = event.data;
    if (!message || message.v !== 1 || typeof message.id !== 'string' ||
        message.id.length > 80 || !['ready', 'error', 'action', 'audio'].includes(message.method)) return;
    const raw = JSON.stringify({ session, request: message });
    if (raw.length <= 10000) window.GoVueGame.postMessage(raw);
  });
  window.__lingoGameReply = reply => frame.contentWindow.postMessage({ v: 1, ...reply }, '*');
  frame.srcdoc = __GOVUE_FRAME__;
})();
</script>
</body>
</html>
