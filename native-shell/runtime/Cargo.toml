[package]
name = "govue-shell-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

[workspace]

[dependencies]
govue-core = { path = "../../core" }
nsh-core = "=0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync"] }
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
