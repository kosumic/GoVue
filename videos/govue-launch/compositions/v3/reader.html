<!doctype html><html lang="en"><body><template>
<style>
#v3-reader-root{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;color:#111b29}
#v3-reader-inner{position:absolute;left:96px;right:150px;top:200px}

#v3-reader-root h1{margin:0;font:600 83px/1.02 Barlow,sans-serif;letter-spacing:-.045em;max-width:830px}
#v3-reader-root h1{display:inline-block;color:#f2f6fa;background:#111b29;font-size:72px;padding:16px 24px 20px;border-radius:12px}
#v3-reader-root .desc{font:400 43px/1.15 Barlow,sans-serif;margin:24px 0 0;max-width:780px;letter-spacing:-.02em}
#v3-reader-root .closing{position:absolute;left:96px;right:150px;top:1450px;color:#e9edf2}
#v3-reader-root .platform{font:400 32px/1.3 Barlow,sans-serif;margin:0 0 18px}
#v3-reader-root .address{font:600 30px/1.3 Barlow,sans-serif;margin:0}
#v3-reader-root .credit{font:400 22px/1.3 Barlow,sans-serif;color:#b5c0cd;margin:22px 0 0;max-width:800px}
</style>
<div id="v3-reader-root" data-composition-id="v3-reader" data-width="1080" data-height="1920" data-duration="10">
 <div id="v3-reader-content" class="clip" data-start="0" data-duration="10" data-track-index="0">
  <div id="v3-reader-inner"><h1>Read along.</h1></div>
  
 </div>
</div>
<script>(()=>{
const tl=gsap.timeline({paused:true});
tl.fromTo('#v3-reader-inner',{y:28,opacity:0},{y:0,opacity:1,duration:.55,ease:'power3.out'},0.15);
tl.to('#v3-reader-inner',{y:-18,opacity:0,duration:.25,ease:'power3.in'},1.05);
window.__timelines['v3-reader']=tl;
})();</script></template></body></html>
