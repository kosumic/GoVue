<!doctype html><html lang="en"><body><template>
<style>
#v2-reader-root{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;color:#151B24}
#v2-reader-root .copy{position:absolute;left:96px;right:145px;top:270px}
#v2-reader-root h1{margin:0;font:500 104px/1.02 Barlow,sans-serif;letter-spacing:-.045em;}
#v2-reader-root .line{display:block;width:100%}
#v2-reader-root .sub{position:absolute;left:96px;right:145px;bottom:385px;margin:0;font:400 37px/1.2 Barlow,sans-serif;color:#354353;max-width:780px}
#v2-reader-root .sub{top:500px;bottom:auto}


#v2-reader-root .logo{position:absolute;left:96px;top:430px;width:118px;height:118px;object-fit:contain}
#v2-reader-root .cta{position:absolute;left:96px;right:145px;top:1315px}
#v2-reader-root .platform{font:400 30px/1.3 Barlow,sans-serif;margin:0 0 21px}
#v2-reader-root .address{font:500 25px/1.25 'IBM Plex Mono',monospace;letter-spacing:-.025em;margin:0}
</style>
<div data-hf-id="hf-iz5i" id="v2-reader-root" data-composition-id="v2-reader" data-width="1080" data-height="1920" data-duration="8">
 <div data-hf-id="hf-iilz" id="v2-reader-content" class="clip" data-start="0" data-duration="8" data-track-index="1">
  
  <div data-hf-id="hf-043f" class="copy" id="v2-reader-copy"><h1 data-hf-id="hf-m3fm"><span data-hf-id="hf-g0ze" id="v2-reader-line-0" class="line">Read along.</span><span data-hf-id="hf-rzvl" id="v2-reader-line-1" class="line">In both languages.</span></h1></div>
  <p data-hf-id="hf-0722" id="v2-reader-sub" class="sub"><span data-hf-id="hf-czag" class="line">Tap a line. Hear it again.</span></p>
  
 </div>
</div>
<script>(()=>{
 const out=p=>p===1?1:1-Math.pow(2,-10*p);
 const into=p=>p===0?0:Math.pow(2,10*(p-1));
 const tl=gsap.timeline({paused:true});
 tl.fromTo('#v2-reader-line-0',{y:35,opacity:0},{y:0,opacity:1,duration:.65,ease:out},1.15);
tl.fromTo('#v2-reader-line-1',{y:35,opacity:0},{y:0,opacity:1,duration:.65,ease:out},1.27);
 tl.fromTo('#v2-reader-sub',{y:18,opacity:0},{y:0,opacity:1,duration:.5,ease:out},4.8);
 tl.to(['#v2-reader-copy','#v2-reader-sub'],{y:-25,opacity:0,duration:.3,ease:into},7.7);
 window.__timelines['v2-reader']=tl;
})();</script>
</template></body></html>
