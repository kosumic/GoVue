name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --locked -p govue-core

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main
        with:
          token: ${{ github.token }}

  javascript:
    name: JavaScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript and TypeScript
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Check app version configuration
        run: npm run check:app-version

      - name: Check bundled license notices
        run: npm run check:licenses

      - name: Test JavaScript and browser behavior
        run: npm test

      - name: Check Expo dependencies
        run: npx expo install --check

  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: moderate

  android:
    name: Android release build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Nix supplies the Android SDK. Remove the runner's duplicate SDK and
      # unused language runtimes before downloading the Nix toolchain.
      - name: Free disk space for Android build
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell /opt/ghc
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          dependency-graph: ${{ github.ref == 'refs/heads/master' && 'generate-and-upload' || 'disabled' }}
          dependency-graph-include-projects: '^:app$'
          dependency-graph-include-configurations: '^releaseRuntimeClasspath$'
          dependency-graph-continue-on-failure: false
          artifact-retention-days: 1

      - name: Initialize Java and Kotlin CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: java-kotlin
          build-mode: manual

      # Enter Nix before installing packages or generating build outputs so
      # path:. does not copy node_modules/ or target/ into the Nix store.
      - name: Generate native project, build arm64 APK, and lint
        id: android-build
        run: |
          nix develop path:. --command bash -euo pipefail <<'NIX_SHELL'
            npm ci --include=dev
            npm run core:android
            npx expo prebuild --platform android --no-install
            android/gradlew -p android :app:assembleRelease :app:lintRelease :govue-core:lintRelease \
              :app:dependencies --configuration releaseRuntimeClasspath \
              -PreactNativeArchitectures=arm64-v8a --max-workers=2 --no-build-cache --no-daemon
          NIX_SHELL

      - name: Verify release dependency snapshot
        if: github.ref == 'refs/heads/master'
        env:
          DEPENDENCY_GRAPH_FILE: ${{ steps.android-build.outputs.dependency-graph-file }}
        run: |
          test -s "$DEPENDENCY_GRAPH_FILE"
          jq -e '.manifests | to_entries | any(.value.resolved | length > 0)' "$DEPENDENCY_GRAPH_FILE"

      - name: Analyze Java and Kotlin
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:java-kotlin

      - name: Upload Android build and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: govue-android-checks
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/reports/lint-results-release.*
            modules/govue-core/android/build/reports/lint-results-release.*
          retention-days: 7

  dependency-submission:
    name: Submit Gradle dependency graph
    needs: android
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Submit the build artifact without checking out or executing app code.
      - name: Submit generated Gradle dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          dependency-graph: download-and-submit
          dependency-graph-continue-on-failure: false
          cache-disabled: true

  ios:
    name: iOS unsigned compile
    needs: android
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Check iOS HTTP byte adapters
        run: npm run test:ios-http

      - name: Generate Rust XCFramework and iOS project
        id: native
        run: |
          test "$(uname -m)" = arm64
          nix develop path:. --command bash -euo pipefail <<'NIX_SHELL'
            npm ci --include=dev
            npm run prebuild:ios -- --no-install
            printf "pod=%s\n" "$(command -v pod)" >> "$GITHUB_OUTPUT"
          NIX_SHELL

      # CocoaPods and Xcode run outside Nix's compiler/SDK environment.
      - name: Install native dependencies
        env:
          POD_COMMAND: ${{ steps.native.outputs.pod }}
        run: |
          "$POD_COMMAND" install --project-directory=ios

      - name: Compile unsigned arm64 iOS app
        run: |
          xcodebuild -quiet \
            -workspace ios/GoVue.xcworkspace -scheme GoVue \
            -configuration Release -sdk iphoneos -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/GoVueDerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build
          app_path="$RUNNER_TEMP/GoVueDerivedData/Build/Products/Release-iphoneos/GoVue.app"
          test -s "$app_path/main.jsbundle"
          test "$(lipo -archs "$app_path/GoVue")" = arm64
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" "$RUNNER_TEMP/GoVue-unsigned.app.zip"

      - name: Upload unsigned compile artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: govue-ios-unsigned-compile-only
          path: ${{ runner.temp }}/GoVue-unsigned.app.zip
          if-no-files-found: error
          retention-days: 7

  check:
    name: CI complete
    if: always()
    needs: [rust, javascript, codeql, dependency-review, android, dependency-submission, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          jq -e --arg event "$EVENT_NAME" --arg ref "$REF" '
            all(to_entries[];
              .value.result == "success" or
              (.key == "dependency-review" and $event != "pull_request" and .value.result == "skipped") or
              (.key == "dependency-submission" and $ref != "refs/heads/master" and .value.result == "skipped")
            )
          ' <<< "$RESULTS"
