name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag matching package.json version (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: production

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free disk space for Android build
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell /opt/ghc
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native-shell/package-lock.json

      - name: Validate release tag against package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/app-version.cjs --tag "$RELEASE_TAG"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: 9.4.1

      - name: Build and sign Native Shell arm64 release APK
        env:
          GOVUE_ANDROID_KEYSTORE_BASE64: ${{ secrets.GOVUE_ANDROID_KEYSTORE_BASE64 }}
          GOVUE_ANDROID_STORE_PASSWORD: ${{ secrets.GOVUE_ANDROID_STORE_PASSWORD }}
          GOVUE_ANDROID_KEY_ALIAS: ${{ secrets.GOVUE_ANDROID_KEY_ALIAS }}
          GOVUE_ANDROID_KEY_PASSWORD: ${{ secrets.GOVUE_ANDROID_KEY_PASSWORD }}
        run: |
          : "${GOVUE_ANDROID_KEYSTORE_BASE64:?Set the signing keystore used for existing GoVue APKs}"
          export GOVUE_ANDROID_KEYSTORE="$(mktemp "$RUNNER_TEMP/govue-release.XXXXXX")"
          trap 'rm -f -- "$GOVUE_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$GOVUE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GOVUE_ANDROID_KEYSTORE"
          unset GOVUE_ANDROID_KEYSTORE_BASE64
          nix develop path:. --command bash -euo pipefail <<'NIX_SHELL'
            npm --prefix native-shell ci
            bash native-shell/android/build-release.sh --max-workers=2 --no-daemon
            apk=native-shell/android/build/outputs/apk/release/GoVueNativeShell-release.apk
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"
            manifest=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk")
            package=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$manifest")
            version=$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" <<< "$manifest")
            test "$package" = io.github.kaminarios.govue
            node scripts/app-version.cjs --actual "Android package version" "$version"
          NIX_SHELL

      - name: Package APK
        run: |
          cp native-shell/android/build/outputs/apk/release/GoVueNativeShell-release.apk govue-arm64.apk
          sha256sum govue-arm64.apk > govue-arm64.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: govue-arm64-apk
          path: |
            govue-arm64.apk
            govue-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --latest \
              --title "GoVue $RELEASE_TAG"
          else
            gh release edit "$RELEASE_TAG" \
              --prerelease=false \
              --latest \
              --title "GoVue $RELEASE_TAG"
          fi

          gh release upload "$RELEASE_TAG" \
            "govue-arm64.apk#GoVue APK (arm64-v8a)" \
            "govue-arm64.apk.sha256#SHA-256 checksum" \
            --clobber

  build-ios:
    name: Compile unsigned iOS app
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Report Apple toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native-shell/package-lock.json

      - name: Compile and validate unsigned iOS device app
        run: |
          test "$(uname -m)" = arm64
          nix develop path:. --command bash -euo pipefail <<'NIX_SHELL'
            npm --prefix native-shell ci
            bash native-shell/ios/build-release.sh device
          NIX_SHELL
          app_path="native-shell/ios/build/iphoneos/GoVue.app"
          test "$(plutil -extract CFBundleIdentifier raw "$app_path/Info.plist")" = io.github.kaminarios.govue
          node scripts/app-version.cjs --actual "iOS bundle version" \
            "$(plutil -extract CFBundleShortVersionString raw "$app_path/Info.plist")"
          test "$(lipo -archs "$app_path/GoVue")" = arm64
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" "$RUNNER_TEMP/govue-ios-unsigned-compile-only.app.zip"

      - name: Upload compile-only iOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: govue-ios-unsigned-compile-only
          path: ${{ runner.temp }}/govue-ios-unsigned-compile-only.app.zip
          if-no-files-found: error
          retention-days: 14
