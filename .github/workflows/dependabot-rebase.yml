name: Dependabot rebase

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-rebase
  cancel-in-progress: false

jobs:
  rebase:
    name: Refresh failed Dependabot updates after master recovers
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Dependabot requires commands from a user with repository push access.
      # Never check out or execute code in this privileged workflow.
      - name: Ask Dependabot to rebase failed, outdated pull requests
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_REBASE_TOKEN }}
          TESTED_BASE_SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_BRANCH: master
          CI_WORKFLOW: ci.yml
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::notice::Set the DEPENDABOT_REBASE_TOKEN Actions secret to enable rebasing; see .github/CI.md'
            exit 0
          fi

          base_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/$BASE_BRANCH" --jq '.commit.sha')"
          if [[ -n "$TESTED_BASE_SHA" && "$base_sha" != "$TESTED_BASE_SHA" ]]; then
            echo "Skipping because $BASE_BRANCH advanced after this CI run"
            exit 0
          fi

          ci_runs="repos/$GITHUB_REPOSITORY/actions/workflows/$CI_WORKFLOW/runs"
          base_conclusion="$(gh api "$ci_runs?event=push&head_sha=$base_sha&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "pending"')"
          if [[ "$base_conclusion" != 'success' ]]; then
            echo "Skipping because current $BASE_BRANCH CI is $base_conclusion"
            exit 0
          fi

          requester_login="$(gh api user --jq '.login')"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$BASE_BRANCH&per_page=100" \
            --jq '.[] | select(.user.login == "dependabot[bot]" and .draft == false and .head.repo.id == .base.repo.id) | [.number, .head.sha] | @tsv' |
          while IFS=$'\t' read -r pr_number head_sha; do
            conclusion="$(gh api "$ci_runs?event=pull_request&head_sha=$head_sha&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "pending"')"
            if [[ "$conclusion" != 'failure' && "$conclusion" != 'timed_out' ]]; then
              echo "Skipping PR #$pr_number because its latest CI is $conclusion"
              continue
            fi

            behind="$(gh api "repos/$GITHUB_REPOSITORY/compare/$base_sha...$head_sha" --jq '.behind_by')"
            if (( behind == 0 )); then
              echo "Skipping PR #$pr_number because it already includes $BASE_BRANCH"
              continue
            fi

            marker="<!-- dependabot-rebase:$base_sha:$head_sha -->"
            requested="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments?per_page=100" |
              jq --arg marker "$marker" --arg requester "$requester_login" \
                'any(.[][]; .user.login == $requester and (.body | contains($marker)))')"
            if [[ "$requested" == 'true' ]]; then
              echo "Skipping PR #$pr_number because this rebase was already requested"
              continue
            fi

            current_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" \
              --jq 'select(.state == "open" and .draft == false and .user.login == "dependabot[bot]" and .head.repo.id == .base.repo.id) | .head.sha')"
            if [[ "$current_head" != "$head_sha" ]]; then
              echo "Skipping PR #$pr_number because it changed during this run"
              continue
            fi

            body="$(printf '@dependabot rebase\n\nBase CI passed; refresh this failed update against %s.\n\n%s' \
              "$base_sha" "$marker")"
            gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          done
