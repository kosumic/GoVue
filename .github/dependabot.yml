version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /native-shell
    cooldown:
      default-days: 1
    open-pull-requests-limit: 8
    schedule:
      interval: daily
    groups:
      npm-patches:
        patterns:
          - '*'
        update-types:
          - patch

  # The root Cargo workspace includes core/ and tools/bindgen/.
  - package-ecosystem: cargo
    directory: /
    cooldown:
      default-days: 1
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /native-shell/android
    cooldown:
      default-days: 1
    schedule:
      interval: weekly
      day: monday
    groups:
      gradle-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 1
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'
